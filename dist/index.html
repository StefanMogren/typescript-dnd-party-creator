<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script type="module" src="./index.js"></script>
		<link rel="stylesheet" href="style.css" />
		<title>AI DungeonMaster</title>
	</head>
	<body class="body">
		<header class="header">
			<section class="header__width-container">
				<section class="header__logo-container">
					<a class="header__nav-link" href="">
						<img
							class="header__logo"
							src="./assets/ai-dnd-logo.jpg"
							alt="AI Dungeon Master logo" />
					</a>
					<p>D&D AI Dungeon Master</p>
				</section>
				<nav class="header__nav">
					<ul class="header__nav-ul">
						<li class="header__nav-li">
							<button class="header__nav-btn">Home</button>
							<!-- <a class="header__nav-link" href="">Home</a> -->
						</li>
						<li class="header__nav-li">
							<button class="header__nav-btn">Game</button>
							<!-- <a class="header__nav-link" href="">Game</a> -->
						</li>
						<li class="header__nav-li">
							<button class="header__nav-btn" id="partyPageId">
								Party Manager
							</button>
							<!-- <a class="header__nav-link" href="Party Manager"></a> -->
						</li>
						<li class="header__nav-li">
							<button class="header__nav-btn">About</button>
							<!-- <a class="header__nav-link" href="">About</a> -->
						</li>
						<li class="header__nav-li">
							<button class="header__nav-btn">Contact</button>
							<!-- <a class="header__nav-link" href="">Contact</a> -->
						</li>
					</ul>
				</nav>
			</section>
		</header>
		<main id="mainId">
			<section class="party-page">
				<h1 class="party-page__title">Create your party of adventurers</h1>

				<section class="party-page__flex-container">
					<form class="party-page__chooser" action="post" id="classFormId">
						<h2 class="party-page__sub-title">The Barbarian</h2>
						<section
							class="party-page__all-classes"
							id="allClassesId"></section>
						<button class="party-page__class-btn" type="submit">
							Select class
						</button>
					</form>

					<!-- ----- Current Party ----- -->
					<article class="party-page__current-party">
						<h2>Current party</h2>
						<section class="party-page__party-container" id="currentPartyId">
							<section class="party-page__party-class">
								<img
									class="party-page__class-img"
									src="./assets/Barbarian.jpg"
									alt="barbarian image" />
								<p>Barra</p>
								<p>Barbarian</p>
							</section>

							<section class="party-page__party-class">
								<img
									class="party-page__class-img"
									src="./assets/fighter.jpg"
									alt="fighter image" />
								<p>Vlad the Impaler</p>
								<p>Fighter</p>
							</section>
						</section>
					</article>
				</section>
			</section>
		</main>
	</body>
</html>
